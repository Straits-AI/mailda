name: ci

# Every check in this repository already worked from a terminal. None of them ran unless somebody
# remembered, which is the same failure the ctx-seam lint had: a check that exists and is not invoked
# reads exactly like a check that passed.
#
# Runners are Blacksmith's. `runs-on` is the only thing that selects them; the cache actions are
# upstream GitHub ones on purpose — Blacksmith archived its `useblacksmith/*` cache forks and now
# optimises `actions/cache` and `actions/setup-node` transparently, so a fork here would be a
# dependency on something unmaintained for no gain.

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be re-triggered without inventing a commit. GitHub's action-download service was
  # unavailable on 6 August and took a run down in `Set up job` before a single step ran; without this,
  # recovering from someone else's outage meant pushing something.
  workflow_dispatch:

# Cancel superseded *pull request* runs, never a push to main.
#
# This was `group: ci-<ref>` with `cancel-in-progress: true`, which is right for a branch someone is
# iterating on and wrong for main: two pushes in quick succession cancelled the first, and a cancelled
# run does not read as a failure anywhere — not in the run list, not on a badge, not to a person
# glancing at the tab. Commit 14522c1 was cancelled that way and never verified at all, which is the
# same landmine as a check that never ran: it looks like nothing is wrong.
#
# So each push to main gets its own group, keyed by sha, and is never superseded. Pull requests still
# collapse to the latest commit, because there a superseded run genuinely tells you about code nobody
# has any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # To list this workflow's own runs. `contents: read` cannot, and the gap check below would report
  # "no gaps" for the wrong reason — it would see nothing at all.
  actions: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Pinned via .nvmrc rather than read from `engines: >=22`, so a new major Node release does
          # not silently change what CI tests against.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is generated from wrangler.jsonc and deliberately not committed, so
      # nothing here typechecks until it exists. Needs no Cloudflare credentials — it reads the config
      # file, not the account.
      - name: Generate Worker binding types
        run: pnpm --filter @mailda/worker types

      # First, because it is the cheapest and it guards the rule the whole codebase is built on: a
      # number in the code comes from a receipt. This regenerates packages/budgets from
      # docs/receipts/*.md and fails if the committed constants differ — so hand-editing a measured
      # value, or changing a receipt without regenerating, stops here rather than shipping.
      - name: Constants match their receipts
        run: pnpm receipts:check

      # Enforces the ctx seam (#6) — bare Date.now()/Math.random() outside the one place they belong.
      # The type checker cannot see this; only a syntactic rule can.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Proves the Worker still bundles and that its bindings resolve against wrangler.jsonc. Catches
      # the class of breakage where the code is fine and the deployment configuration is not. No
      # credentials: --dry-run never contacts the account.
      - name: Worker bundles with its bindings
        run: pnpm --filter @mailda/worker exec wrangler deploy --dry-run

      # Fails when a single test exceeds half the 30s timeout.
      #
      # The threshold was measured before it was set, which is the order this repository insists on: the
      # first run of this workflow reported the slowest test at 753ms — CI derives PBKDF2 about nine
      # times faster than the laptop the timeout was sized on — so failing at 50% leaves ~20x margin
      # over what was observed. See docs/receipts/test-timeout-headroom.md.
      #
      # It gates rather than warns because a printed number nobody fails on is the muted check AGENTS.md
      # describes. No second test run: the Test step already emitted the report, since vitest.config.ts
      # adds a json reporter when CI is set.
      - name: Test headroom on this hardware
        if: always()
        run: node .github/scripts/test-headroom.mjs

      # Fails when a previous push to main lost its verdict.
      #
      # A cancelled run reads as neither pass nor fail, which is how commit 14522c1 went unverified and
      # looked fine. The concurrency policy that caused it is fixed and `test/node/ci-policy.test.ts`
      # stops that regressing — but a run can still be cancelled by a person, or lost to an outage the
      # way 51f283e was, and neither of those is a policy problem. This is the part that notices.
      #
      # `if: always()` so a failing suite does not hide a missing verdict behind itself.
      - name: Every push to main got a verdict
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verdict-gaps.mjs ${{ github.run_id }}
