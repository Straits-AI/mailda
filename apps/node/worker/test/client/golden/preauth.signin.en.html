<!-- #status -->
<span class="field">
<span class="dot live">
</span>
<span>listening</span>
</span>
<span class="field mono">localhost:3000</span>
<!-- #app -->
<div class="split">
<div class="split-lede" data-reveal="" style="--reveal-delay: 0ms;">
<h1>Shared inboxes that know who replied.</h1>
<p>Every message that arrives here is kept byte for byte, encrypted at rest, and readable only by people you have granted access. Access is re-checked on every request — not carried in a token.</p>
</div>
<section class="panel" data-reveal="" style="--reveal-delay: 55ms;">
<h2>Sign in</h2>
<form novalidate="novalidate">
<button class="primary" type="button">Sign in with a passkey</button>
<p class="dim">or sign in with your password</p>
<label class="field-row" for="email">
<span>Email</span>
<input id="email" type="email" required="required" autocomplete="username">
</label>
<label class="field-row" for="password">
<span>Password</span>
<input id="password" type="password" required="required" autocomplete="current-password">
</label>
<button class="primary" type="submit">Sign in</button>
<div class="errors" role="alert">
</div>
</form>
<p class="hint">
<button class="linkish" type="button">I have an invitation</button>
</p>
</section>
</div>
