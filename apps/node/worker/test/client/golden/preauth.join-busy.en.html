<label class="field-row" for="invitation">
<span>Invitation secret</span>
<input id="invitation" required="required" autocomplete="off" class="mono">
</label>
<label class="field-row" for="join-password">
<span>Choose a password</span>
<input id="join-password" type="password" required="required" autocomplete="new-password">
</label>
<p class="hint">At least 12 characters. No character-class rules — length is what resists guessing.</p>
<button class="primary" type="submit" disabled="">Joining…</button>
<div class="errors" role="alert">
</div>
