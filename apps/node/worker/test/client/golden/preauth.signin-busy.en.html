<button class="primary" type="button">Sign in with a passkey</button>
<p class="dim">or sign in with your password</p>
<label class="field-row" for="email">
<span>Email</span>
<input id="email" type="email" required="required" autocomplete="username">
</label>
<label class="field-row" for="password">
<span>Password</span>
<input id="password" type="password" required="required" autocomplete="current-password">
</label>
<button class="primary" type="submit" disabled="">Signing in…</button>
<div class="errors" role="alert">
</div>
